<!doctype html>
<html lang="zh-Hant" data-mode="dark" data-theme="lime">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="輸入文字描述，透過 AI 生成 1280 × 720 圖片並套用為 YuMeew 背景素材。" />
    <title>文生圖 · YuMeew</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/text-to-image.css" />
    <script type="module" src="./js/text-to-image.js"></script>
  </head>
  <body class="text-to-image-body">
    <header class="text-to-image-header">
      <a class="brand" href="./" aria-label="返回 YuMeew 主畫面"><span class="brand-icon" aria-hidden="true">✦</span>文生圖<span class="brand-sub">TEXT TO IMAGE</span></a>
      <span class="cloud-note"><i></i>提示詞會傳送至 Cloudflare Workers AI</span>
      <a class="reset-settings text-to-image-back" href="./">← 返回主畫面</a>
    </header>

    <main class="text-to-image-main">
      <section class="text-to-image-heading">
        <div>
          <div class="eyebrow">CREATE WITH WORDS</div>
          <h1>把想像變成畫面<span>。</span></h1>
          <p>輸入你想要的場景、風格、色彩與光線，AI 將生成一張 1280 × 720 圖片。</p>
        </div>
        <span id="generation-status" class="generation-status" role="status" aria-live="polite">等待輸入圖片描述</span>
      </section>

      <section class="panel prompt-panel">
        <label class="field-label" for="image-prompt">圖片描述</label>
        <textarea id="image-prompt" maxlength="2048" placeholder="例如：星空下的黑膠唱片，霓虹城市倒映在唱片表面，電影感光線，細節豐富"></textarea>
        <div class="prompt-actions">
          <span id="prompt-count">0 / 2048</span>
          <button id="generate-image" class="export-button" type="button" disabled>✦ 生成圖片</button>
        </div>
        <p id="generation-error" class="generation-error" role="alert" hidden></p>
      </section>

      <section class="panel result-panel">
        <div class="result-heading"><div class="section-title"><span>1280 × 720</span><h2>生成結果</h2></div><small>16:9 · JPEG</small></div>
        <div id="generated-image-frame" class="generated-image-frame">
          <div id="empty-result" class="empty-result"><span aria-hidden="true">✦</span><strong>生成的圖片會出現在這裡</strong><small>完成前不會離開目前頁面</small></div>
          <img id="generated-image" alt="AI 生成圖片" hidden />
        </div>
        <div class="result-actions">
          <button id="download-image" class="reset-settings" type="button" disabled>↓ 下載圖片</button>
          <button id="apply-background" class="export-button" type="button" disabled>套用主畫面背景 →</button>
        </div>
        <p class="result-storage-note">生成結果只暫存在目前分頁；只有按下「套用主畫面背景」才會取代瀏覽器保存的背景素材。</p>
      </section>
    </main>

    <div id="generation-lock" class="generation-lock" role="status" aria-live="assertive" hidden>
      <div class="generation-loader" aria-hidden="true"><span></span><span></span><span></span></div>
      <strong>圖片生成中</strong>
      <p>正在把文字轉換成畫面，請稍候…</p>
    </div>
  </body>
</html>
