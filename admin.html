<!doctype html>
<html lang="zh-Hant" data-mode="dark" data-theme="lime">
  <head>
    <meta charset="utf-8" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7132586781018963" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="管理 YuMeew 會員額度、儲值換算比例與平台 API KEY。" />
    <title>管理員 · YuMeew</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/admin.css" />
    <script type="module" src="./js/admin.js"></script>
    <script type="module" src="./js/member-status.js"></script>
    <script type="module" src="./js/loading-screen.js"></script>
  </head>
  <body class="admin-body" aria-busy="true">
    <div id="feature-loading" class="feature-loading" role="status" aria-live="polite"><div class="feature-loading-card"><span class="feature-loading-spinner" aria-hidden="true"></span><strong>功能載入中</strong><small>正在驗證管理員權限…</small></div></div>
    <header class="admin-header">
      <a class="brand" href="./" aria-label="返回 YuMeew 主畫面"><span class="brand-icon" aria-hidden="true">♫</span>YuMeew<span class="brand-sub">ADMIN</span></a>
    </header>
    <main class="admin-main">
      <section class="admin-heading">
        <div><div class="eyebrow">MEMBER ADMINISTRATION</div><h1>管理員<span>。</span></h1><p>管理會員額度、儲值換算比例與平台服務商 API KEY。</p></div>
        <span id="admin-status" class="admin-status" role="status" aria-live="polite">正在驗證管理員權限…</span>
      </section>

      <section id="admin-access" class="panel admin-access"><h2>正在確認權限</h2><p>請稍候，系統正在驗證目前登入的會員身分。</p></section>

      <div id="admin-dashboard" class="admin-dashboard" hidden>
        <section class="panel admin-panel">
          <div class="section-title"><span>01</span><h2>儲值換算設定</h2></div>
          <p class="admin-intro">設定以臺灣銀行美元即期中間匯率換算時，平台保留的百分比。</p>
          <form id="margin-form" class="admin-inline-form">
            <label for="margin-percent"><span>平台保留</span><span class="admin-number"><input id="margin-percent" type="number" min="0" max="100" step="0.01" required /><b>%</b></span></label>
            <button type="submit">儲存比例</button>
          </form>
          <p id="margin-preview" class="admin-note"></p>
        </section>

        <section class="panel admin-panel member-admin-panel">
          <div class="section-title"><span>02</span><h2>會員人工加值</h2></div>
          <form id="member-search-form" class="member-search-form">
            <label for="member-query">會員信箱、名稱或 UUID</label>
            <div><input id="member-query" type="search" autocomplete="off" placeholder="輸入關鍵字；留空可列出最近會員" /><button type="submit">搜尋會員</button></div>
          </form>
          <div id="member-results" class="member-results" aria-live="polite"></div>
          <form id="topup-form" class="admin-topup-form">
            <div id="selected-member" class="selected-member">尚未選擇會員</div>
            <label for="admin-topup-amount">加值金額（USD）<input id="admin-topup-amount" type="number" min="0.01" max="1000000" step="0.01" required disabled /></label>
            <label for="admin-topup-description">紀錄說明<input id="admin-topup-description" type="text" maxlength="500" value="管理員人工加值" required disabled /></label>
            <button id="admin-topup-submit" type="submit" disabled>確認加值</button>
          </form>
        </section>

        <section class="panel admin-panel api-key-admin-panel">
          <div class="section-title"><span>03</span><h2>平台 API KEY</h2></div>
          <p class="admin-intro">金鑰依服務商保存在 Cloudflare KV。完整內容不會從後端讀回；輸入新金鑰可直接覆寫。</p>
          <div id="admin-api-keys" class="admin-api-keys" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <dialog id="topup-confirm-dialog" class="reset-dialog" aria-labelledby="topup-confirm-title">
      <form method="dialog"><h2 id="topup-confirm-title">確認人工加值？</h2><p id="topup-confirm-message"></p><div class="dialog-actions"><button class="text-button" value="cancel">取消</button><button class="dialog-confirm" value="confirm">確認加值</button></div></form>
    </dialog>
    <dialog id="api-key-delete-dialog" class="reset-dialog" aria-labelledby="api-key-delete-title">
      <form method="dialog"><h2 id="api-key-delete-title">刪除平台 API KEY？</h2><p id="api-key-delete-message"></p><div class="dialog-actions"><button class="text-button" value="cancel">取消</button><button class="dialog-confirm" value="confirm">確認刪除</button></div></form>
    </dialog>
  </body>
</html>
